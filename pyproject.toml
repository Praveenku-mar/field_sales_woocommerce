[project]
name = "field_sales_woocommerce"
authors = [
    { name = "Agamnxt Technologies", email = "praveenkumar@agamnxt.com"}
]
description = "WooCommerce Connector for Field Sales"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests-oauthlib",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"
